services:
  # Database — not published to the host (stops other apps hitting :5432 as user "postgres").
  # Use: docker exec -it kabana_db psql -U kabana_user -d kabana_db
  db:
    profiles: ["dev", "prod"]
    image: postgres:15-alpine
    container_name: kabana_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host ports — only reachable on kabana_net
    networks:
      - kabana_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kabana_web_dev
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - PYTHONPATH=/app
    networks:
      - kabana_net
    depends_on:
      db:
        condition: service_healthy
      ftp:
        condition: service_started
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4
    container_name: kabana_pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    networks:
      - kabana_net
    depends_on:
      db:
        condition: service_healthy

  ftp:
    profiles: ["dev"]
    image: fauria/vsftpd
    container_name: kabana_ftp
    environment:
      # Local vsftpd only — do not reuse remote DL FTP_* from .env
      FTP_USER: ftp_user
      FTP_PASS: ftp_pass
      PASV_ADDRESS: ftp
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
      LOCAL_UMASK: "022"
    volumes:
      - ./storage:/home/vsftpd/ftp_user
    ports:
      - "20:20"
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - kabana_net

  filemanager:
    profiles: ["dev"]
    image: filebrowser/filebrowser
    container_name: kabana_filemanager
    volumes:
      - ./storage:/srv
      - filebrowser_data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    ports:
      - "8080:80"
    networks:
      - kabana_net

  web_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kabana_web_prod
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
      - PYTHONPATH=/app
    networks:
      - kabana_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  nginx:
    profiles: ["prod"]
    image: nginx:alpine
    container_name: kabana_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    networks:
      - kabana_net
    depends_on:
      web_prod:
        condition: service_healthy
    restart: always

  # Scraper — start with: docker compose --profile scraper up -d scraper
  # Requires db already on kabana_net (e.g. --profile dev or prod).
  scraper:
    profiles: ["scraper"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kabana_scraper
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    command:
      - /bin/sh
      - -c
      - python scripts/wait_for_db.py && python -m app.scraper --update --loop
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    networks:
      - kabana_net
    restart: unless-stopped

volumes:
  postgres_data:
  filebrowser_data:

networks:
  kabana_net:
